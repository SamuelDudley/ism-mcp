[project]
name = "ism-mcp"
version = "0.1.0"
description = "Agent-friendly query layer over the ASD Information Security Manual, served via MCP."
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.9",
]

[project.scripts]
ism-mcp = "ism_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ism_mcp"]
